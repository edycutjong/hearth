name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:           # re-run on demand, e.g. right after the repo goes public

# One run per branch/PR. A superseded run tells you nothing and costs minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── STAGE 1: Code quality (Next.js app + Python worker/harness) ─────────────
  quality:
    name: "Stage 1 · Quality (Node)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on main; one version on PRs.
        node-version: ${{ github.event_name == 'push' && fromJSON('[20, 22, 24]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests, with coverage
        run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  quality-python:
    name: "Stage 1 · Quality (Python worker)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --output-format=github worker scripts
      # The worker's unit tests import worker.py without torch/NeMo (those install only inside the Job).
      - name: Worker + harness tests
        run: python -m pytest -q worker scripts --cov=worker --cov=scripts --cov-report=term-missing --cov-fail-under=100

  # ── STAGE 2: Security (parallel with Stage 1) ───────────────────────────────
  secret-scan:
    name: "Stage 2 · Secret scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the point is to scan history, not the tip
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependency-audit:
    name: "Stage 2 · Dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: npm audit (production dependencies)
        # Advisory, deliberately: a fix that needs a major framework bump must never be applied
        # unattended to a submitted project. Reasoning and current state: .github/SECURITY.md.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: pip-audit (CI Python dependencies)
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt
        continue-on-error: true
      - name: License compliance
        run: npx --yes license-checker --production --failOn "GPL-3.0;AGPL-3.0" --summary
        continue-on-error: true

  # ── STAGE 3: Build verification ─────────────────────────────────────────────
  build:
    name: "Stage 3 · Build"
    needs: [quality, quality-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Next.js production build
        run: npm run build
      - name: Bundle size budget
        run: |
          TOTAL=$(du -sk .next/static | cut -f1)
          echo "Total static assets: ${TOTAL}KB"
          if   [ "$TOTAL" -gt 2000 ]; then echo "::error::${TOTAL}KB exceeds the 2000KB budget"; exit 1
          elif [ "$TOTAL" -gt 1500 ]; then echo "::warning::${TOTAL}KB exceeds the 1500KB warning line"
          else echo "within budget"; fi

  # ── STAGE 4: E2E ────────────────────────────────────────────────────────────
  e2e:
    name: "Stage 4 · E2E"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      # No environment is supplied on purpose: the suite exercises the zero-credential cold visit
      # (/judge, /proof, 404, 375 px), which is the path every judge takes.
      - name: Playwright
        run: npm run e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── STAGE 5: Performance ────────────────────────────────────────────────────
  performance:
    name: "Stage 5 · Performance"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Through the action, not a devDependency: @lhci/cli drags lighthouse + puppeteer into the tree.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
        continue-on-error: true      # advisory until a baseline exists

  # ── STAGE 6: Gate (main only). Stage 7 deploys only after this passes. ─────────
  deploy-gate:
    name: "Stage 6 · Deploy gate"
    needs: [quality, quality-python, secret-scan, dependency-audit, build, e2e, performance]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # The Vercel project `hearth` is not git-linked: Stage 7 deploys this exact commit SHA through the
      # Vercel API (gitSource), and /api/proof reports the serving commit.
      - name: Pipeline summary
        run: |
          {
            echo "### Gates passed for ${GITHUB_SHA::7}"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| 1 · Quality (eslint, tsc, vitest + coverage, ruff, pytest) | passed |"
            echo "| 2 · Secret scanning + dependency audit | passed (audit advisory) |"
            echo "| 3 · Build + bundle budget | passed |"
            echo "| 4 · E2E (Playwright, desktop + 375 px, no credentials) | passed |"
            echo "| 5 · Performance (Lighthouse) | advisory |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── STAGE 7: Deploy (main only) → GitHub environment "production" ────────────
  # Deploys THIS commit from GitHub (Vercel API gitSource, so /api/proof reports the serving SHA), waits until it is
  # READY and aliased, then smoke-tests the live routes. Frozen after the submission deadline so the judged build
  # never moves; a manual workflow_dispatch can still redeploy on purpose.
  deploy:
    name: "Stage 7 · Deploy (Vercel production)"
    needs: [deploy-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://hearth.edycu.dev
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      TEAM_ID: team_RJcQx4a22v5LqjetHv8HhhLY
      PROJECT: hearth
      FREEZE_AT: "2026-10-30T17:00:00Z"   # Devpost deadline, 10:00 PDT
    steps:
      - name: Deadline freeze
        id: freeze
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d "$FREEZE_AT" +%s)" ]; then
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Past the submission deadline: production stays on the judged commit."
          fi
      - name: Create deployment from ${{ github.sha }}
        if: steps.freeze.outputs.frozen != 'true'
        id: create
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          body=$(jq -n --arg sha "$GITHUB_SHA" --arg p "$PROJECT" \
            '{name:$p, project:$p, target:"production",
              gitSource:{type:"github", org:"edycutjong", repo:"hearth", ref:"main", sha:$sha}}')
          res=$(curl -sS -X POST "https://api.vercel.com/v13/deployments?teamId=$TEAM_ID&forceNew=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d "$body")
          id=$(echo "$res" | jq -r '.id // empty')
          if [ -z "$id" ]; then echo "$res" | jq '{error}' ; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "url=https://$(echo "$res" | jq -r '.url')" >> "$GITHUB_OUTPUT"
      - name: Wait until READY
        if: steps.freeze.outputs.frozen != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            state=$(curl -sS "https://api.vercel.com/v13/deployments/${{ steps.create.outputs.id }}?teamId=$TEAM_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.readyState')
            echo "readyState=$state"
            case "$state" in READY) exit 0 ;; ERROR|CANCELED) exit 1 ;; esac
            sleep 10
          done
          echo "::error::deployment not READY after 10 minutes"; exit 1
      - name: Smoke-test production
        if: steps.freeze.outputs.frozen != 'true'
        run: |
          sleep 5
          for path in / /judge /proof /about /pitch /api/proof; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://hearth.edycu.dev$path")
            echo "$path $code"; [ "$code" = 200 ] || exit 1
          done
          served=$(curl -s https://hearth.edycu.dev/api/proof | jq -r '.deployed.commit')
          echo "serving $served"; [ "$served" = "$GITHUB_SHA" ] || { echo "::error::alias serves $served, not $GITHUB_SHA"; exit 1; }
          {
            echo "### Deployed ${GITHUB_SHA::7} to production"
            echo ""
            echo "- Live: https://hearth.edycu.dev (serving \`${served::7}\`)"
            echo "- Deployment: ${{ steps.create.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
